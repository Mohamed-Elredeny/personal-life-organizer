# fly.toml — Life OS (personal-life-organizer)
# Generated for: Fly.io · region fra (Frankfurt) · SQLite on volume · FrankenPHP

app = "personal-life-organizer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -c 'mkdir -p /app/storage/database && touch /app/storage/database/life-os.sqlite && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache && php artisan filament:cache-components'"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_TIMEZONE = "Asia/Riyadh"
  APP_LOCALE = "en"
  APP_FALLBACK_LOCALE = "en"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "warning"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/app/storage/database/life-os.sqlite"
  SESSION_DRIVER = "database"
  SESSION_LIFETIME = "120"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"
  BROADCAST_CONNECTION = "log"
  FILESYSTEM_DISK = "local"
  MAIL_MAILER = "log"
  VITE_APP_NAME = "Life OS"
  SERVER_NAME = ":8080"
  CADDY_GLOBAL_OPTIONS = "auto_https off"

[[mounts]]
  source = "life_os_data"
  destination = "/app/storage/database"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
